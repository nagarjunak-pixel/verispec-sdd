[build-system]
requires = ["hatchling>=1.26.0"]
build-backend = "hatchling.build"

[project]
name = "verispec-sdd"
version = "1.0.0"
description = "Executable SPEC.md State-Machine Compiler, C++20 Finite-State Reachability/Deadlock/Livelock Prover & Hypothesis/TypeScript Property-Test Synthesizer with FastAPI & MCP Server"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12"
authors = [
    { name = "Nagarjuna Kamireddy", email = "writetonagarjuna@gmail.com" },
]
keywords = [
    "spec-driven-development",
    "formal-verification",
    "state-machine",
    "property-based-testing",
    "hypothesis",
    "ai-coding-agents",
    "mcp",
    "cpp20",
]
dependencies = [
    "fastapi>=0.115.0",
    "httpx>=0.28.0",
    "pydantic>=2.10.0",
    "rich>=13.9.0",
    "typer>=0.15.0",
    "uvicorn>=0.34.0",
]

[project.optional-dependencies]
dev = [
    "hypothesis>=6.122.0",
    "mypy>=1.14.0",
    "pytest>=8.3.0",
    "pytest-asyncio>=0.25.0",
    "pytest-cov>=6.0.0",
    "ruff>=0.9.0",
]

[project.scripts]
verispec = "verispec.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/verispec"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["B008", "E501"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true
mypy_path = "src"

[[tool.mypy.overrides]]
module = ["hypothesis.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.coverage.run]
branch = true
source = ["verispec"]
